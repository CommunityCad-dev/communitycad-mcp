name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate and pack the Claude Desktop extension
        run: |
          npx -y @anthropic-ai/mcpb@2 validate mcpb/manifest.json
          npx -y @anthropic-ai/mcpb@2 pack mcpb dist/communitycad-mcp.mcpb
