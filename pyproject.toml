[project]
name = "communitycad-mcp"
version = "0.0.0"
description = "MCP server for CommunityCAD: search real parts, read datasheets, and download CAD files into your design."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "cad", "step", "communitycad", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "platformdirs>=4",
]

[project.scripts]
communitycad-mcp = "communitycad_mcp.__main__:main"

[project.urls]
Homepage = "https://communitycad.dev"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/communitycad_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
