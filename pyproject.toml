[project]
name = "communitycad-mcp"
version = "0.0.0"
description = "MCP server for CommunityCAD: search real parts, read datasheets, and download CAD files into your design."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "cad", "step", "communitycad", "model-context-protocol"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]
dependencies = []

[project.urls]
Homepage = "https://communitycad.dev"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/communitycad_mcp"]
