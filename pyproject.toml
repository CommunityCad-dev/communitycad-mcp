[project]
name = "communitycad-mcp"
version = "0.1.2"
description = "MCP server for CommunityCAD: search real parts, read datasheets, and download CAD files into your design."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CommunityCAD" }]
keywords = ["mcp", "model-context-protocol", "cad", "step", "stl", "datasheet", "communitycad", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pillow>=10",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
communitycad-mcp = "communitycad_mcp.__main__:main"

[project.urls]
Homepage = "https://communitycad.dev"
Documentation = "https://communitycad.dev/docs/mcp"
Repository = "https://github.com/CommunityCad-dev/communitycad-mcp"
Issues = "https://github.com/CommunityCad-dev/communitycad-mcp/issues"
Changelog = "https://github.com/CommunityCad-dev/communitycad-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/communitycad_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
